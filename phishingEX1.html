<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #fff;
  }
  .box {
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
  }
  .logo {
    text-align: center;
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .logo span:nth-child(1) { color: #4285F4; }
  .logo span:nth-child(2) { color: #EA4335; }
  .logo span:nth-child(3) { color: #FBBC05; }
  .logo span:nth-child(4) { color: #4285F4; }
  .logo span:nth-child(5) { color: #34A853; }
  .logo span:nth-child(6) { color: #EA4335; }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 400;
    margin: 0 0 8px;
  }
  p.sub {
    text-align: center;
    color: #5f6368;
    font-size: 14px;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #5f6368;
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    font-size: 15px;
  }
  input:focus { outline: 2px solid #1a73e8; border-color: transparent; }
  button {
    width: 100%;
    padding: 10px;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #1765cc; }
  .warn {
    background: #fef7e0;
    color: #7a5c00;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 4px;
    margin-bottom: 20px;
  }
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: #9aa0a6;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
    <h1>Connexion requise</h1>
    <p class="sub">Vérification nécessaire pour maintenir l'accès à votre compte</p>

    <div class="warn">
      ⚠️ Votre compte fera l'objet d'une suspension si vous ne confirmez pas votre identité.
    </div>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" placeholder="exemple@gmail.com" required>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" placeholder="Mot de passe" required>

      <button type="submit">Suivant</button>
    </form>

    <div class="footer">© Démo pédagogique — aucune donnée n'est collectée</div>
  </div>

  <script>
    // Démo : aucune capture ni transmission d'identifiants.
    // Le formulaire se contente d'afficher une alert() au submit,
    // conformément à la consigne de l'exercice.
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Abdellah El Haddaoui'); // <-- remplace par ton nom si besoin
      this.reset();
    });
  </script>
</body>
</html>
